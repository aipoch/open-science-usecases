<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pelican Coastal Experience</title>
  <style>:root {
  --glass: rgba(16, 28, 40, 0.52);
  --line: rgba(255, 255, 255, 0.16);
  --text: #f4f7fa;
  --muted: rgba(244, 247, 250, 0.68);
  --accent: #ffb547;
  --accent-ink: #2a1a00;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ea; color: var(--text);
  font: 14px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; outline: none; }
#scene.dragging { cursor: grabbing; }

.panel { position: fixed; background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
  -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3);
  box-shadow: 0 10px 30px rgba(0, 20, 40, 0.22); opacity: 0; transition: opacity .5s ease; }
body.ready .panel { opacity: 1; }
body.no-ui .panel { display: none; }

.title { top: 16px; left: 16px; padding: 12px 16px; max-width: calc(100vw - 32px); }
.title h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: .01em; }
.title p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }

.hud { top: 16px; right: 16px; padding: 10px 6px; display: flex; align-items: center; }
.hud div { padding: 0 12px; text-align: center; border-right: 1px solid var(--line); min-width: 74px; }
.hud div:nth-last-of-type(1) { border-right: 0; }
.hud b { display: block; font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.hud span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; }
.hud small { position: absolute; right: 10px; bottom: -20px; font-size: 11px; color: rgba(255, 255, 255, .8); text-shadow: 0 1px 3px rgba(0, 0, 0, .5); font-variant-numeric: tabular-nums; }

.controls { left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 18px; padding: 10px; display: flex; align-items: center; gap: 10px;
  max-width: calc(100vw - 24px); flex-wrap: wrap; justify-content: center; }

.btn, .seg button { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  height: 40px; padding: 0 14px; border-radius: 11px; cursor: pointer; transition: background .15s, border-color .15s, transform .08s; white-space: nowrap; }
.btn:hover, .seg button:hover { background: rgba(255, 255, 255, 0.17); }
.btn:active, .seg button:active { transform: translateY(1px); }
.btn:focus-visible, .seg button:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.active { background: rgba(255, 181, 71, 0.22); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; min-width: 104px; justify-content: center; }
.btn.primary:hover { background: #ffc56e; }
.btn.primary svg { width: 18px; height: 18px; fill: currentColor; }
.btn.primary .i-play, .btn.primary.paused .i-pause { display: none; }
.btn.primary.paused .i-play { display: block; }

.slider { display: flex; flex-direction: column; gap: 5px; width: 190px; padding: 0 6px; }
.slider .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.slider output { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { --fill: 45%; -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 4px 0; border-radius: 6px; cursor: pointer;
  background: linear-gradient(to right, var(--accent) var(--fill), rgba(255, 255, 255, 0.22) var(--fill)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 0 13px; background: transparent; }
.seg button:last-child { border-right: 0; }
.seg button.active { background: rgba(255, 255, 255, 0.92); color: #12202c; font-weight: 650; }

.error { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 80vw; padding: 14px 18px; border-radius: 12px;
  background: rgba(120, 20, 20, 0.92); color: #fff; font-family: ui-monospace, Menlo, monospace; font-size: 13px; z-index: 10; }
#test-results { position: fixed; inset: 0; margin: 0; padding: 16px; overflow: auto; background: rgba(8, 14, 20, 0.92); color: #d7f5d0;
  font: 11px/1.3 ui-monospace, Menlo, monospace; z-index: 20; }

@media (max-width: 760px) {
  .hud { top: auto; bottom: 132px; right: 50%; transform: translateX(50%); padding: 6px 2px; }
  .hud div { min-width: 62px; padding: 0 8px; } .hud b { font-size: 15px; } .hud small { display: none; }
  .title p { display: none; }
  .slider { width: 100%; order: 5; }
  .controls { gap: 8px; bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }

.edition {display:block;font-size:10px;letter-spacing:.18em;color:#d9d6ca;margin:4px 0 7px}.loading {position:fixed;inset:0;z-index:100;background:#192a2c;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;color:#e4e1d6;font:13px system-ui;letter-spacing:.1em}.loading b {font-weight:400;letter-spacing:.32em}.loading[hidden]{display:none}
@media (max-height: 480px) {
  .title { top: 8px; left: 8px; padding: 7px 11px; }
  .title h1 { font-size: 14px; }
  .title p, .edition, .hud { display: none; }
  .controls { bottom: 6px; padding: 6px; gap: 6px; }
  .btn, .seg button { height: 32px; padding: 0 8px; font-size: 12px; }
  .btn.primary { min-width: 76px; }
  .slider { width: 115px; order: 0; gap: 1px; padding: 0 3px; }
  .slider .lbl { font-size: 10px; }
}

.title{display:none!important}.hud{top:18px;right:18px;background:#092d33c9;border-radius:12px}.controls{background:#092d33e8;box-shadow:0 8px 30px #0003;border-radius:14px;bottom:20px;max-width:calc(100vw - 32px)}:root{--accent:#b7f1ce;--accent-ink:#063c36}.hud small{display:none}.controls .slider{width:180px}@media(max-width:760px){.hud{top:16px;bottom:auto;right:16px;transform:none}.hud div{min-width:48px;padding:0 6px}.hud div:nth-child(n+3){display:none}.controls .slider{width:95%;order:5}.seg button,.btn{padding:0 10px;height:36px}.controls{gap:6px}}
</style>
  
<style>.hud,.controls,.title{display:none!important}</style></head>
<body>
  <canvas id="scene" aria-label="3D scene: a pelican riding a bicycle along a coastal road"></canvas>

  <header class="panel title">
    <h1>Pelican on a Bicycle</h1>
    <span class="edition">COASTAL STUDY · 01</span>
    <p>Drag to orbit · scroll to zoom · double-click to recentre</p>
  </header>

  <section class="panel hud" aria-label="Live telemetry">
    <div><b id="hSpeed">0</b><span>km/h</span></div>
    <div><b id="hCadence">0</b><span>pedal rpm</span></div>
    <div><b id="hWheel">0</b><span>wheel rpm</span></div>
    <div><b id="hDist">0 m</b><span>ridden</span></div>
    <small id="fps">– fps</small>
  </section>

  <nav class="panel controls" aria-label="Controls">
    <button id="play" class="btn primary" title="Pause (Space)" aria-label="Pause animation">
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.4-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z"/></svg>
      <span id="playLabel">Pause</span>
    </button>

    <label class="slider">
      <span class="lbl">Speed <output id="speedVal" for="speed">16 km/h</output></span>
      <input id="speed" type="range" min="0" max="36" step="1" value="16" aria-label="Cycling speed in km/h">
    </label>

    <div class="seg" role="group" aria-label="Camera view">
      <button data-view="side" title="Side view (1)">Side</button>
      <button data-view="front" title="Front view (2)">Front</button>
      <button data-view="rear" title="Rear view (3)">Rear</button>
      <button data-view="free" title="Free camera (4)">Free</button>
    </div>

    <button id="rig" class="btn" title="Show the leg / wing IK skeleton (G)">Skeleton</button>
    <button id="reset" class="btn" title="Reset scene and camera (R)">Reset</button>
  </nav>

  <div id="loading" class="loading" role="status"><b>COASTAL STUDY</b><span>Loading the coastal scene…</span></div>
  <div id="error" class="error" hidden></div>
  <noscript><div class="error">This demo needs JavaScript and WebGL.</div></noscript>
